<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>1.txt をそのまま表示</title>
</head>
<body>

<pre id="content">読み込み中…</pre>

<script>
  // HTMLエスケープ関数
  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  fetch("1.txt")
    .then(res => res.text())
    .then(text => {
      document.getElementById("content").innerHTML = escapeHtml(text);
    })
    .catch(err => {
      document.getElementById("content").textContent = "読み込み失敗: " + err;
    });
</script>

</body>
</html>
