<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>1.txt を HTML として表示</title>
</head>
<body>

<div id="content">読み込み中…</div>

<script>
  fetch("1.txt")
    .then(res => res.text())
    .then(text => {
      // ★ HTML として解釈させる
      document.getElementById("content").innerHTML = text;
    })
    .catch(err => {
      document.getElementById("content").textContent = "読み込み失敗: " + err;
    });
</script>

</body>
</html>
