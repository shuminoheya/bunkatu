<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realtime GPS / WASM Telemetry</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIINfhmNHN6u2Yl3Jg4H5Jx2F6R6sL4sJw=" crossorigin="">
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--green:#00ff66;--text:#c9d1d9;--muted:#8b949e}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:Consolas,"Courier New",monospace}
.container{max-width:1000px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 8px 24px #0008}
h1{margin:0 0 16px;text-align:center;color:var(--green);font-size:1.25rem;border-bottom:1px dashed var(--line);padding-bottom:12px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
button{padding:11px 18px;border:2px solid var(--green);background:transparent;color:var(--green);border-radius:7px;font:inherit;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}button.tracking{background:#e33;color:#fff;border-color:#e33}
.layout{display:grid;grid-template-columns:1fr 1.25fr;gap:15px}
.data{display:grid;gap:7px;align-content:start}
.item{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-left:3px solid var(--line);background:#ffffff04}
.item.active{border-left-color:var(--green)}.label{color:var(--muted)}.value{text-align:right;font-weight:bold;word-break:break-word}
#map{height:430px;border:1px solid var(--line);border-radius:8px}
.status{margin-top:12px;text-align:center;color:var(--muted);font-size:.82rem}
.log{margin-top:12px;max-height:130px;overflow:auto;padding:10px;border:1px solid var(--line);font-size:.72rem;color:#9aa4af;white-space:pre-wrap}
@media(max-width:700px){.layout{grid-template-columns:1fr}#map{height:330px}}
</style>
</head>
<body>
<div class="container">
<h1>LIVE GPS / WASM TELEMETRY</h1>
<div class="controls">
<button id="trackBtn">START TRACKING</button>
<button id="addressBtn" disabled>UPDATE ADDRESS</button>
</div>
<div class="layout">
<div class="data">
<div class="item" id="i-lat"><span class="label">緯度</span><span class="value" id="lat">--</span></div>
<div class="item" id="i-lng"><span class="label">経度</span><span class="value" id="lng">--</span></div>
<div class="item" id="i-address"><span class="label">住所</span><span class="value" id="address">--</span></div>
<div class="item" id="i-alt"><span class="label">高さ / 高度</span><span class="value" id="alt">--</span></div>
<div class="item" id="i-heading"><span class="label">向き</span><span class="value" id="heading">--</span></div>
<div class="item" id="i-speed"><span class="label">速度</span><span class="value" id="speed">--</span></div>
<div class="item" id="i-accuracy"><span class="label">GPS精度</span><span class="value" id="accuracy">--</span></div>
<div class="item" id="i-time"><span class="label">更新時刻</span><span class="value" id="time">--</span></div>
</div>
<div id="map"></div>
</div>
<div class="status" id="status">System Ready. HTTPS / localhost required.</div>
<div class="log" id="log"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="./gps.js"></script>
</body>
</html>
